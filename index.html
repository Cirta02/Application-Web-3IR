<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Mes Projets Application Web 3 IR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome pour les icônes -->
    <script src="https://kit.fontawesome.com/yourkitid.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(63, 94, 251, 1) 0%, rgba(252, 70, 107, 1) 100%);
            color: #fff;
            text-align: center;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 50px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
        }

        .tp-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .tp-button {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 20px 35px;
            font-size: 1.2em;
            font-weight: 700;
            color: #3F5EFB;
            background: rgba(255, 255, 255, 0.85);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
        }

        .tp-button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            background: rgba(255, 255, 255, 1);
        }

        .tp-button i {
            font-size: 1.5em;
            color: #3F5EFB;
        }

        footer {
            margin-top: 50px;
            font-size: 14px;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 600px) {
            .tp-button {
                width: 80%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <h1>Mes Projets Application Web 3 IR</h1>

    <div class="tp-container">
        <a class="tp-button" href="tp1/"><i class="fas fa-file-code"></i>TP1</a>
        <a class="tp-button" href="tp2/"><i class="fas fa-file-code"></i>TP2</a>
        <a class="tp-button" href="tp3/"><i class="fas fa-file-code"></i>TP3</a>
        <a class="tp-button" href="tp4/"><i class="fas fa-file-code"></i>TP4</a>
        <a class="tp-button" href="tp5/"><i class="fas fa-file-code"></i>TP5</a>
        <a class="tp-button" href="tp6/"><i class="fas fa-brackets-curly"></i>TP6 (Angular)</a>
    </div>

    <footer>
        &copy; 2025 Cirta – Tous droits réservés
    </footer>

</body>

</html>
